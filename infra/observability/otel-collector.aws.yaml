receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    timeout: 5s
    send_batch_size: 2048
  resourcedetection:
    detectors: [env, ecs]
    timeout: 2s
    override: false
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: http.request.header.x-csrf-token
        action: delete
      - key: http.request.header.idempotency-key
        action: delete
      - key: enduser.id
        action: hash
      - key: caller.e164
        action: delete
      - key: callee.e164
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: url.query
        action: delete
  transform/redact_bodies:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\+[1-9][0-9]{7,14}", "<e164>")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<email>")
          - replace_pattern(body, "(sk|rk|whsec|sess)_[A-Za-z0-9_-]{8,}", "<secret>")

exporters:
  otlphttp/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:GRAFANA_OTLP_AUTH}
    compression: gzip
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 10000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/redact, batch]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors:
        [memory_limiter, resourcedetection, attributes/redact, transform/redact_bodies, batch]
      exporters: [otlphttp/grafana]
