name: ci

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  VELYRIC_ENV: ci
  VELYRIC_REQUIRE_FULL_DB: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  typescript-static:
    name: TypeScript lint, typecheck and generated artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ts
      - run: pnpm run contracts:check
      - run: pnpm run lint:ts
      - run: pnpm -r --if-present run typecheck
      - run: pnpm --filter @velyric/web run content:dates:check
      - run: pnpm run test:scripts

  typescript-tests:
    name: TypeScript unit, workflow and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      VELYRIC_TEST_DATABASE_URL: postgres://postgres:postgres-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ts
      - run: pnpm run test:ts
      - run: pnpm --filter @velyric/workflow-worker run test:workflows
      - run: pnpm run test:db

  rust:
    name: Rust fmt, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
          POSTGRES_DB: velyric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      VELYRIC_DATABASE_MIGRATOR_URL: postgres://postgres:postgres-ci@127.0.0.1:5432/velyric
      VELYRIC_TEST_DATABASE_URL: postgres://postgres:postgres-ci@127.0.0.1:5432/velyric
      VELYRIC_TEST_REDIS_URL: redis://127.0.0.1:6379
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@velyric/db..." run build
      - run: node packages/db/dist/cli.js migrate
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --include-ignored

  python:
    name: Python lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest

  migrations:
    name: Migrations apply cleanly and are idempotent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
          POSTGRES_DB: velyric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      VELYRIC_DATABASE_MIGRATOR_URL: postgres://postgres:postgres-ci@127.0.0.1:5432/velyric
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@velyric/db..." run build
      - run: pnpm --filter @velyric/db run manifest:update -- --check
      - run: node packages/db/dist/cli.js migrate
      - run: node packages/db/dist/cli.js migrate
      - run: node packages/db/dist/cli.js verify
      - run: node packages/db/dist/cli.js seed

  e2e:
    name: Playwright end-to-end journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [typescript-static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/env-local.mjs
      - run: >-
          docker compose --env-file .env -f infra/docker/compose.dev.yml
          up --detach --wait postgres redis nats temporal minio mailpit
      - run: pnpm run build:ts
      - run: node --env-file=.env packages/db/dist/cli.js migrate
      - run: node --env-file=.env packages/db/dist/cli.js seed
      - run: pnpm --filter @velyric/e2e exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - if: failure()
        run: docker compose --env-file .env -f infra/docker/compose.dev.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            compose.log
          retention-days: 7
