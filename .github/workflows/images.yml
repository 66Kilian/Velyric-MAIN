name: images

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'crates/**'
      - 'db/**'
      - 'infra/docker/images/**'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - 'uv.lock'
      - '.github/workflows/images.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/images/web.Dockerfile
            target: runtime
            build-args: |
              VELYRIC_CONTROL_API_URL=http://control-api.velyric.internal:4000
          - name: control-api
            dockerfile: infra/docker/images/node-service.Dockerfile
            target: runtime
            build-args: |
              PACKAGE=@velyric/control-api
              SERVICE_PORT=4000
          - name: workflow-worker
            dockerfile: infra/docker/images/node-service.Dockerfile
            target: runtime
            build-args: |
              PACKAGE=@velyric/workflow-worker
              SERVICE_PORT=7200
          - name: connector-worker
            dockerfile: infra/docker/images/node-service.Dockerfile
            target: runtime
            build-args: |
              PACKAGE=@velyric/connector-worker
              SERVICE_PORT=7300
          - name: db-migrate
            dockerfile: infra/docker/images/db-migrate.Dockerfile
            target: runtime
            build-args: ''
          - name: voice-runtime
            dockerfile: infra/docker/images/rust-service.Dockerfile
            target: runtime
            build-args: |
              CRATE=velyric-voice-runtime
              BINARY=velyric-voice-runtime
          - name: metering-worker
            dockerfile: infra/docker/images/rust-service.Dockerfile
            target: runtime
            build-args: |
              CRATE=velyric-metering-worker
              BINARY=velyric-metering-worker
          - name: document-worker
            dockerfile: infra/docker/images/python-service.Dockerfile
            target: document-worker
            build-args: |
              PACKAGE=velyric-document-worker
          - name: eval-runner
            dockerfile: infra/docker/images/python-service.Dockerfile
            target: eval-runner
            build-args: |
              PACKAGE=velyric-eval-runner
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && vars.VELYRIC_ECR_REGISTRY != '' && vars.VELYRIC_IMAGE_PUBLISH_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.VELYRIC_IMAGE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.VELYRIC_AWS_REGION || 'eu-central-1' }}
      - if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PUBLISH == 'true' && format('{0}/velyric/{1}', vars.VELYRIC_ECR_REGISTRY, matrix.name) || format('velyric/{0}', matrix.name) }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          provenance: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - if: env.PUBLISH != 'true'
        run: |
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          user="$(docker image inspect --format '{{.Config.User}}' "$image")"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "$image runs as root" >&2
            exit 1
          fi
