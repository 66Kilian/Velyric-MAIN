name: Deploy VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velyric-vps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment: VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact master revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Skip superseded revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer master revision exists; this run will not deploy.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install password-based SSH support
        if: steps.revision.outputs.current == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends sshpass
      - name: Deploy and verify the VPS
        if: steps.revision.outputs.current == 'true'
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_DOMAIN: ${{ vars.VPS_DOMAIN || 'velyric.com' }}
          VPS_MODE: ${{ vars.VPS_MODE || 'sandbox' }}
        run: bash infra/vps/deploy-from-actions.sh
