[project]
name = "velyric-document-worker"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.18.1",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "markdown-it-py==4.2.0",
    "filetype==1.2.0",
    "defusedxml==0.7.1",
    "pytesseract==0.3.13",
    "openai==3.13.0",
    "nats-py==2.15.0",
    "boto3==1.43.93",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "uuid-utils==1.0.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.scripts]
velyric-document-worker = "velyric_document_worker.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "velyric_document_worker"
